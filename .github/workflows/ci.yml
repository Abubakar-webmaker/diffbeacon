name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test, Lint, Typecheck, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # No real keys in CI — AI is disabled, deterministic diff always runs
          GROQ_API_KEY: ""
          ANTHROPIC_API_KEY: ""

      - name: CLI smoke test
        run: |
          echo '{"user":{"id":123,"name":"Alice"}}' > /tmp/baseline.json
          echo '{"user":{"id":"123"}}' > /tmp/candidate.json
          npx tsx cli/diffbeacon.mjs /tmp/baseline.json /tmp/candidate.json --format json
          # Verify exit code 1 on breaking changes
          npx tsx cli/diffbeacon.mjs /tmp/baseline.json /tmp/candidate.json --fail-on breaking && exit 1 || true
